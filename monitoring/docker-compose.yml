# Monitoring of TravelAgency and of the Ubuntu host: Prometheus, Grafana and the exporters.
# Needs the stack Jenkins deploys with Terraform (its network travelagency-tf-net must exist).
#   cd monitoring
#   cp .env.example .env && nano .env
#   python3 setup.py             # creates the MySQL user of the exporter, starts everything, checks the targets
#   Grafana:    http://<Ubuntu IP>:3000/   (admin / GRAFANA_ADMIN_PASSWORD)
#   Prometheus: http://localhost:9090/     (only on Ubuntu itself)

name: monitoring

x-defaults: &defaults
  restart: unless-stopped

services:
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      # No login in Prometheus itself: only for this machine. Grafana is the UI for the network
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      monitoring:
      travelagency:
        ipv4_address: ${TF_NET_PREFIX:-172.31.0}.40
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    <<: *defaults
    image: grafana/grafana:12.4.12
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Used only when Grafana starts with an empty database (the first time)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # CPU, memory, disk, network of the Ubuntu host. It reads the host's /proc and /sys
  # through a read-only view of the root filesystem and the host's process list
  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # CPU, memory, network of every container. Read-only views of the host; the Docker and
  # containerd sockets (in /var/run) give the container names
  cadvisor:
    <<: *defaults
    image: ghcr.io/google/cadvisor:0.60.5
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=advtcp,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MySQL of the stack: connections, queries, InnoDB. User "exporter" (setup.py creates it)
  mysqld-exporter:
    <<: *defaults
    image: prom/mysqld-exporter:v0.20.0
    command:
      - --mysqld.address=travelagency-tf-db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}
    networks:
      monitoring:
      travelagency:
        ipv4_address: ${TF_NET_PREFIX:-172.31.0}.41
    healthcheck:
      # The start page, not /metrics: a scrape opens MySQL connections and the user may have only 3
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9104/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx of the stack: requests and connections from its stub_status page.
  # The image has no shell or wget for a health check; Prometheus shows it as up{job="nginx"}
  nginx-exporter:
    <<: *defaults
    image: nginx/nginx-prometheus-exporter:1.5.3
    command:
      - --nginx.scrape-uri=http://travelagency-tf-lb/nginx-status
    networks:
      monitoring:
      travelagency:
        ipv4_address: ${TF_NET_PREFIX:-172.31.0}.42

  # HTTP checks from outside: the site, each application server, Jenkins, Nexus, SonarQube
  blackbox-exporter:
    <<: *defaults
    image: prom/blackbox-exporter:v0.28.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      monitoring:
      travelagency:
        ipv4_address: ${TF_NET_PREFIX:-172.31.0}.43
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitoring:
  # The network of the Terraform stack. Fixed addresses .40–.43 (and .44 for the load test):
  # Terraform gives the database .10, the servers .11–.15 and the load balancer .20
  travelagency:
    name: travelagency-tf-net
    external: true

volumes:
  prometheus_data:
  grafana_data:
