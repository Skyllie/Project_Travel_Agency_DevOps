# The dashboards in monitoring/grafana/dashboards, in the folder "TravelAgency".
# They are files in Git: a change made in the Grafana UI is not saved (allowUiUpdates: false)
apiVersion: 1
providers:
  - name: travelagency
    folder: TravelAgency
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
