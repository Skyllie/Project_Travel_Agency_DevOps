# SonarQube Community Build with PostgreSQL: continuous code inspection of TravelAgency.
# Once on the host (Elasticsearch inside SonarQube needs it):
#   echo "vm.max_map_count=524288" | sudo tee /etc/sysctl.d/99-sonarqube.conf && sudo sysctl --system
#   cd sonarqube
#   cp .env.example .env && nano .env
#   docker compose up -d           # 2–3 minutes until healthy
#   python3 setup.py               # admin password, project, quality gate, the token for Jenkins
#   http://<Ubuntu IP>:9000/

name: sonarqube

services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in .env}
      # Three JVMs: web server, compute engine (processes the analyses), Elasticsearch.
      # Small heaps: one project is analysed here
      SONAR_WEB_JAVAOPTS: "-Xms128m -Xmx512m"
      SONAR_CE_JAVAOPTS: "-Xms128m -Xmx512m"
      SONAR_SEARCH_JAVAOPTS: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 10

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in .env}
      POSTGRES_DB: sonar
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
