# TravelAgency behind a load balancer: Nginx -> 3 application servers -> MySQL 8.4.
#   cp .env.example .env      # then change the passwords in .env
#   docker compose up -d --build
#   http://<host>/            (LB_PORT, 80 by default)

name: travelagency

# Settings shared by the three application servers
x-app: &app
  build: .
  image: travelagency:local
  restart: unless-stopped
  expose:
    - "8080"

x-app-env: &app-env
  DB_HOST: db
  DB_NAME: ${DB_NAME:-travelagency}
  DB_TRAVELAGENCY_USER: ${DB_USER:-travel}
  DB_TRAVELAGENCY_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  HBM2DDL_AUTO: update

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-travelagency}
      MYSQL_USER: ${DB_USER:-travel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # TCP on 127.0.0.1: during the first start MySQL runs a temporary server
      # without networking, so the check passes only when the real server is up
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      lb_net:
        ipv4_address: 172.30.0.10

  # app1 starts first: it creates the tables and, on an empty database, loads the demo data
  app1:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_SEED: auto
      # jvmRoute: Tomcat adds ".app1" to the session id, the balancer uses it for sticky sessions
      JAVA_OPTS: ${JAVA_OPTS:--Xmx320m} -DjvmRoute=app1
    networks:
      lb_net:
        ipv4_address: 172.30.0.11

  # app2 and app3 start after app1 is healthy (the tables exist) and never load demo data
  app2:
    <<: *app
    depends_on:
      app1:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_SEED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xmx320m} -DjvmRoute=app2
    networks:
      lb_net:
        ipv4_address: 172.30.0.12

  app3:
    <<: *app
    depends_on:
      app1:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_SEED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xmx320m} -DjvmRoute=app3
    networks:
      lb_net:
        ipv4_address: 172.30.0.13

  lb:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    environment:
      LB_ALGORITHM: ${LB_ALGORITHM:-round_robin}   # file name in lb/upstreams/
      LB_STICKY: ${LB_STICKY:-on}                  # on | off
    volumes:
      - ./lb/templates:/etc/nginx/templates:ro
      - ./lb/upstreams:/etc/nginx/upstreams:ro
      - ./lb/sticky:/etc/nginx/sticky:ro
    ports:
      - "${LB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-status"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      lb_net:
        ipv4_address: 172.30.0.20

volumes:
  db_data:

networks:
  lb_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
