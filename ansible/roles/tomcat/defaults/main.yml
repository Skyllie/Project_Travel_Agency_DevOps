tomcat_version: "9.0.122"
tomcat_url: "https://archive.apache.org/dist/tomcat/tomcat-9/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
tomcat_home: /opt/tomcat
tomcat_user: tomcat
tomcat_port: 8080

# WAR built on the control node: run "mvn clean package" in the project root first
tomcat_war_path: "{{ playbook_dir }}/../target/TravelAgency.war"

# Needs the HBM2DDL_AUTO / DB_SEED code change; without it the app ignores both
tomcat_hbm2ddl_auto: update
