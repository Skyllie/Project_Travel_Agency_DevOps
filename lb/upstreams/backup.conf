# Active + backup: app1 and app2 share the traffic; app3 is a backup server and gets
# requests only when both app1 and app2 are down.
upstream travel_pool {
    zone travel_pool 64k;            # shared by all nginx workers: one counter, one list of failed servers
    server 172.30.0.11:8080 max_fails=1 fail_timeout=10s;          # app1
    server 172.30.0.12:8080 max_fails=1 fail_timeout=10s;          # app2
    server 172.30.0.13:8080 backup;                                # app3
    keepalive 16;
}
