# Round robin (nginx default): the servers take requests in turn — app1, app2, app3, app1, ...
# max_fails/fail_timeout: after 3 failed attempts within 10 s a server is skipped for 10 s.
upstream travel_pool {
    zone travel_pool 64k;            # shared by all nginx workers: one counter, one list of failed servers
    server 172.30.0.11:8080 max_fails=3 fail_timeout=10s;   # app1
    server 172.30.0.12:8080 max_fails=3 fail_timeout=10s;   # app2
    server 172.30.0.13:8080 max_fails=3 fail_timeout=10s;   # app3
    keepalive 16;
}
