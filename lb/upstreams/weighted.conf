# Weighted round robin: app1 has weight 3, so it gets 3 of every 5 requests (60%),
# app2 and app3 get 1 each (20%). Useful when one server is stronger than the others.
upstream travel_pool {
    zone travel_pool 64k;            # shared by all nginx workers: one counter, one list of failed servers
    server 172.30.0.11:8080 weight=3 max_fails=3 fail_timeout=10s;   # app1
    server 172.30.0.12:8080 weight=1 max_fails=3 fail_timeout=10s;   # app2
    server 172.30.0.13:8080 weight=1 max_fails=3 fail_timeout=10s;   # app3
    keepalive 16;
}
